version: '3.8'

services:
  # 1. PostgreSQL 16 Relational Database
  db:
    image: postgres:16-alpine
    container_name: legal_metrology_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: legal_metrology_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d legal_metrology_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI Statutory Enforcement Backend & OCR Engine
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: legal_metrology_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/legal_metrology_db
      SECRET_KEY: legal-metrology-secret-key-for-jwt-signing-siih2026-secure
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
      - reports_data:/app/generated_reports

  # 3. React / Vite / Tailwind Web Portal (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: legal_metrology_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  uploads_data:
  reports_data:
