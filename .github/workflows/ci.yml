name: CI/CD Pipeline - Legal Metrology Compliance Scanner

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Job 1: Backend Automated Testing (273 Tests) - SQLite, no PostgreSQL needed
  backend-tests:
    name: Backend Pytest & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (OpenCV & Tesseract)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 tesseract-ocr tesseract-ocr-eng libtesseract-dev
          which tesseract && tesseract --version
          find /usr/share/tesseract-ocr -name "tessdata" -type d 2>/dev/null || true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx requests

      - name: Run Backend Pytest Suite (273 Tests)
        env:
          PYTHONPATH: backend
          DATABASE_URL: sqlite:///./test_legal_metrology.db
        run: |
          cd backend
          TDATA=$(find /usr/share/tesseract-ocr -name "tessdata" -type d 2>/dev/null | head -1)
          [ -n "$TDATA" ] && export TESSDATA_PREFIX="$TDATA" && echo "tessdata: $TDATA"
          pytest -v --tb=short -x

      - name: Run Master E2E Demonstration Script
        env:
          PYTHONPATH: backend
          DATABASE_URL: sqlite:///./test_legal_metrology.db
        run: |
          cd backend
          TDATA=$(find /usr/share/tesseract-ocr -name "tessdata" -type d 2>/dev/null | head -1)
          [ -n "$TDATA" ] && export TESSDATA_PREFIX="$TDATA"
          python scripts/demo_pipeline.py

  # Job 2: Frontend Production Build & Code Quality
  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Vite Production SPA
        run: |
          cd frontend
          npm run build

      - name: Upload Production Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
